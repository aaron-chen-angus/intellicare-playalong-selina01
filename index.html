<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>intelliCARE Music Play-a-Long · 翎羽悸動 Fluttering Feathers, Stirring Hearts</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07070F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Play-a-Long">
<style>
:root{--bg1:#07070F;--bg2:#12102A;--kick:#FF7A1A;--snare:#FF3B5C;--hihat:#FFD23F;--tom:#3D8BFF;--cymbal:#2EE6A6;--pink:#FF5FA2;--lilac:#C9A7FF;--silver:#D9DEE8;--beat:1.5s;
--txt:#EEF0FF;--dim:#A9AED6;--glass:rgba(24,22,56,.72);--line:rgba(255,255,255,.14);
--font:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg1);color:var(--txt);font-family:var(--font);overflow:hidden;
overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
/* ---------- game shell ---------- */
#app{display:grid;height:100dvh;background:linear-gradient(180deg,var(--bg1),var(--bg2));
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);position:relative}
#app.portrait{grid-template-columns:100%;grid-template-rows:32px auto 36px minmax(22vh,1fr) auto;
grid-template-areas:"header" "video" "hud" "highway" "pads"}
#app.landscape{grid-template-columns:minmax(0,1.65fr) minmax(340px,1fr);grid-template-rows:32px 36px minmax(0,1fr) auto;
grid-template-areas:"header header" "video hud" "video highway" "info pads"}
#app.landscape.short{grid-template-rows:0 36px minmax(0,1fr) auto}
#app.landscape.short #hdr{display:none}
#hdr{grid-area:header;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;white-space:nowrap;overflow:hidden;
background:rgba(255,255,255,.04);border-bottom:1px solid var(--line)}
#hdr .t{flex:1;overflow:hidden;text-overflow:ellipsis}
#hdr b{color:var(--pink)}
.ibtn{background:none;border:0;min-width:32px;height:30px;font-size:16px;border-radius:8px}
.ibtn:active{background:rgba(255,255,255,.12)}
#videoWrap{grid-area:video;background:#000;width:100%;aspect-ratio:16/9;max-height:40dvh;align-self:start;position:relative;overflow:hidden}
#app.landscape #videoWrap{align-self:center;max-height:100%}
#vid{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#info{grid-area:info;display:none;padding:10px 14px;align-self:start}
#app.landscape #info{display:block}
#info .zh{font-size:22px;font-weight:700;color:var(--pink)}#info .en{font-size:15px}#info .by{font-size:12px;color:var(--dim)}
#hud{grid-area:hud;display:flex;align-items:center;gap:10px;padding:0 10px;position:relative;font-size:13px;white-space:nowrap}
#hud #score{font-size:20px;font-weight:800;min-width:78px}
#hud .chip{padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-weight:700;font-size:12px}
#hud #mult{background:#2a2750}
#hud #mult.t2{background:#1b4a8a}#hud #mult.t3{background:#7a2a8a}#hud #mult.t4{background:#b3541a}
#hud .sp{flex:1}
#ghost{font-size:11px;color:var(--dim)}#ghost.up{color:var(--cymbal)}#ghost.dn{color:var(--snare)}
#heartBtn{display:none;background:var(--pink);color:#220014;border:0;border-radius:99px;height:28px;padding:0 10px;font-weight:800;animation:pulse .7s infinite alternate}
#rock{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08)}
#rock i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--snare),var(--hihat),var(--cymbal));transition:width .15s}
#hwWrap{grid-area:highway;position:relative;overflow:hidden;min-height:22vh;touch-action:none}
#hw{position:absolute;inset:0;width:100%;height:100%;display:block}
#toast{position:absolute;top:6px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:5}
.toast{background:var(--glass);border:1px solid var(--pink);padding:5px 14px;border-radius:99px;font-size:13px;font-weight:700;
animation:slideIn .25s ease-out,fadeOut .4s 2.1s forwards;backdrop-filter:blur(8px)}
#bigText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:64px;font-weight:900;
text-shadow:0 0 24px var(--pink);opacity:0;z-index:4}
#bigText.show{animation:pop .9s ease-out}
#bigText.small{font-size:24px}
#bufMsg{position:absolute;left:50%;top:40%;transform:translateX(-50%);display:none;background:var(--glass);padding:6px 16px;border-radius:99px;z-index:6;font-weight:700}
#practiceBar{position:absolute;left:4px;top:4px;display:none;gap:4px;flex-wrap:wrap;z-index:6;max-width:100%}
#practiceBar button,#practiceBar select{background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;min-height:26px;color:var(--txt)}
#practiceBar .on{border-color:var(--cymbal);color:var(--cymbal)}
#testUI{position:absolute;inset:0;display:none;z-index:7;background:rgba(7,7,15,.88);padding:10px;overflow:auto;text-align:center}
#testUI h3{margin:6px 0}#testUI .big{font-size:40px;font-weight:900;margin:8px 0}
/* ---------- pads ---------- */
#pads{grid-area:pads;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:minmax(64px,1fr) minmax(48px,.7fr);gap:8px;padding:8px 10px;
height:min(24dvh,190px);min-height:136px;touch-action:none}
#app.landscape #pads{height:min(30dvh,210px)}
#app.landscape.short #pads{min-height:116px;grid-template-rows:minmax(52px,1fr) minmax(44px,.7fr)}
#pads.p4{grid-template-columns:repeat(3,1fr)}#pads.p4 [data-lane="tom"]{display:none}
.pad{--c:#fff;position:relative;border:2px solid var(--c);border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 28%,transparent),color-mix(in srgb,var(--c) 6%,transparent));
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;touch-action:none;user-select:none;-webkit-user-select:none;
transition:transform .06s,box-shadow .1s;font-weight:800;letter-spacing:.5px;font-size:12px;min-width:0}
.pad svg{width:26px;height:26px;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pad small{font-size:10px;font-weight:600;color:var(--dim);display:none}
body.kbd .pad small{display:block}
.pad[data-lane="kick"]{grid-column:1/-1;flex-direction:row;gap:10px}
.pad.down{transform:scale(.94);box-shadow:0 0 24px var(--c),inset 0 0 18px color-mix(in srgb,var(--c) 50%,transparent)}
.pad.ready{animation:rim .35s infinite alternate}
.pad .mast{position:absolute;top:2px;right:6px;font-size:10px}
@supports not (background:color-mix(in srgb,red 50%,blue)){.pad{background:rgba(255,255,255,.08)}}
[data-lane=kick]{--c:#FF7A1A}[data-lane=snare]{--c:#FF3B5C}[data-lane=hihat]{--c:#FFD23F}[data-lane=tom]{--c:#3D8BFF}[data-lane=cymbal]{--c:#2EE6A6}
body.heart .pad{border-color:var(--pink)}
/* ---------- overlays ---------- */
#menu,#sheet{position:fixed;inset:0;z-index:50;display:none;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#menu{background:radial-gradient(1200px 700px at 20% -10%,#2b1b5e 0,transparent 60%),radial-gradient(900px 600px at 100% 110%,#5e1b49 0,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2));
padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
#menu.show{display:block}
#menu .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bud{position:fixed;pointer-events:none;color:var(--pink);opacity:.0;animation:float 9s linear infinite;z-index:0}
#menu .wrap{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--tom),var(--pink));display:grid;place-items:center;font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
@supports not (backdrop-filter:blur(1px)){.glass{background:#1b1840}}
.song .zh{font-size:30px;font-weight:900;color:var(--pink);line-height:1.15}.song .en{font-size:18px;font-weight:700}.song .by{color:var(--dim);font-size:13px;margin-top:2px}
.song .art{height:92px;border-radius:12px;margin-bottom:10px;background:linear-gradient(120deg,#1d2a6e,#6e1d57 60%,#FF5FA2);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;position:relative}
.song .art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(255,255,255,.05) 14px 15px)}
.pill{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:8px 6px;min-height:52px;flex:1;text-align:center;font-weight:700;font-size:14px;line-height:1.25}
.pill small{display:block;font-size:11px;color:var(--dim);font-weight:500}
.pill.on{border-color:var(--cymbal);box-shadow:0 0 14px rgba(46,230,166,.45);background:rgba(46,230,166,.1)}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;min-height:44px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(90deg,var(--snare),var(--pink));border:0;color:#fff;font-size:22px;min-height:60px;width:100%;font-weight:900;letter-spacing:2px;box-shadow:0 0 30px rgba(255,59,92,.5)}
.btn.small{min-height:36px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--tom),var(--pink));border-radius:9px}
.dim{color:var(--dim)}.sm{font-size:12px}
.notice{font-size:12px;color:var(--hihat);background:rgba(255,210,63,.08);border:1px solid rgba(255,210,63,.3);border-radius:12px;padding:8px 10px}
.ring{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--cymbal);animation:spin 1s linear infinite;display:inline-block;vertical-align:middle}
#sheet{background:rgba(4,4,12,.72);backdrop-filter:blur(6px);padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
#sheet.show{display:block}
#sheet .panel{max-width:620px;margin:0 auto}
#sheet h2{margin:0 0 8px;font-size:20px}#sheet h3{margin:14px 0 6px;font-size:15px;color:var(--dim)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim);margin:6px 0}
input,select,textarea{font:inherit;color:var(--txt);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;user-select:text;-webkit-user-select:text;width:100%}
input[type=range]{padding:0}input[type=checkbox]{width:auto;min-height:0}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:6px 0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
/* results */
.grade{font-size:72px;font-weight:900;line-height:1;color:var(--pink);text-shadow:0 0 30px var(--pink)}
.stars{font-size:26px;color:var(--hihat);letter-spacing:4px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.kv div{background:rgba(255,255,255,.05);border-radius:10px;padding:6px 2px}.kv b{display:block;font-size:18px}
.pb{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px}.pb span:first-child{width:52px;font-weight:700}.pb .bar{flex:1}.pb span:last-child{width:118px;text-align:right;color:var(--dim)}
table.cm{border-collapse:collapse;width:100%;font-size:11px;text-align:center}table.cm td,table.cm th{padding:3px 1px;border:1px solid rgba(255,255,255,.08)}
.tl{display:flex;align-items:flex-end;gap:1px;height:46px}.tl i{flex:1;min-width:2px;border-radius:2px 2px 0 0;background:var(--cymbal)}
.tip{padding:6px 10px;border-left:3px solid var(--hihat);background:rgba(255,210,63,.07);border-radius:6px;margin:4px 0;font-size:13px}
.stat{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800}
.live{background:#12452f;color:#4dff9e}.sync{background:#4d3a0a;color:#ffc94d}.off{background:#2b2b3a;color:#aaa}
.lbrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;margin:3px 0;background:rgba(255,255,255,.05);transition:transform .4s,background .6s}
.lbrow.me{outline:1px solid var(--cymbal)}.lbrow.new{background:rgba(255,95,162,.25);animation:slideIn .4s}
.lbrow .rk{width:28px;font-weight:900}.lbrow .av{width:22px;height:22px;border-radius:50%}.lbrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow:nth-child(1) .rk{color:#ffd23f}.lbrow:nth-child(2) .rk{color:#cfd6e6}.lbrow:nth-child(3) .rk{color:#d08a4a}
.skel{height:34px;border-radius:10px;margin:3px 0;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:shine 1.2s infinite}
.achv{display:grid;grid-template-columns:1fr 1fr;gap:6px}.achv div{padding:8px;border-radius:12px;background:rgba(255,255,255,.05);font-size:12px}.achv .lock{opacity:.4;filter:grayscale(1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:99px;padding:5px 11px;font-size:12px;min-height:32px}.chips .on{border-color:var(--pink);color:var(--pink)}
/* editor */
#edBar{display:none;position:absolute;left:0;right:0;top:0;gap:4px;padding:4px;flex-wrap:wrap;background:rgba(7,7,15,.9);z-index:8;border-bottom:1px solid var(--line)}
#edBar button,#edBar select{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;min-height:28px;width:auto;color:var(--txt)}
#edBar .on{border-color:var(--snare);color:var(--snare)}
#debug{position:fixed;left:4px;bottom:4px;z-index:99;font:11px/1.3 monospace;background:rgba(0,0,0,.7);color:#7dffb5;padding:4px 6px;border-radius:6px;display:none;pointer-events:none;white-space:pre}
@keyframes pulse{to{transform:scale(1.08);box-shadow:0 0 18px var(--pink)}}
@keyframes rim{to{box-shadow:0 0 16px var(--c)}}
@keyframes slideIn{from{transform:translateY(-14px);opacity:0}}
@keyframes fadeOut{to{opacity:0;transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes float{0%{transform:translateY(105vh) rotate(0);opacity:0}10%{opacity:.5}90%{opacity:.3}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.bud{display:none}}
</style>
<style id="premium">
/* =================== PREMIUM LAYER (v1.1) =================== */
:root{--gold:#ffd88a;--chrome:linear-gradient(180deg,#fff 0%,#e9e4ff 38%,#a69fd0 52%,#f4f0ff 70%,#cfc8f2 100%);--ink:#05040b}
body{background:#05040b}
.bud{display:none}
/* ---------- MENU / STAGE ---------- */
#menu{background:#05040b;padding:0}
#menu .stage{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;
 background:radial-gradient(120% 70% at 50% 108%,#3b0d36 0%,rgba(59,13,54,0) 60%),radial-gradient(90% 60% at 50% -10%,#1d1450 0%,rgba(29,20,80,0) 65%),#05040b}
.beam{position:absolute;top:-20%;width:46vmax;height:150%;transform-origin:50% 0;mix-blend-mode:screen;filter:blur(18px);opacity:.55;
 background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 55%,rgba(255,255,255,0) 80%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%)}
.beam.b1{left:-12%;background:linear-gradient(180deg,rgba(255,95,162,.75),rgba(255,95,162,.08) 60%,transparent 85%);animation:sweep1 9s ease-in-out infinite alternate}
.beam.b2{left:28%;opacity:.42;animation:sweep2 11s ease-in-out infinite alternate}
.beam.b3{right:-12%;background:linear-gradient(180deg,rgba(201,167,255,.75),rgba(201,167,255,.08) 60%,transparent 85%);animation:sweep3 10s ease-in-out infinite alternate}
@keyframes sweep1{from{transform:rotate(-26deg)}to{transform:rotate(-6deg)}}
@keyframes sweep2{from{transform:rotate(-8deg)}to{transform:rotate(9deg)}}
@keyframes sweep3{from{transform:rotate(24deg)}to{transform:rotate(5deg)}}
.haze{position:absolute;inset:0;background:radial-gradient(60% 35% at 50% 62%,rgba(255,95,162,.22),transparent 70%),radial-gradient(40% 25% at 30% 40%,rgba(120,90,255,.18),transparent 70%);animation:haze 14s ease-in-out infinite alternate}
@keyframes haze{to{transform:translate3d(0,-3%,0) scale(1.08);opacity:.75}}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,190,230,.8);opacity:0;animation:mote linear infinite}
@keyframes mote{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.9}100%{transform:translate3d(var(--dx),-70vh,0);opacity:0}}
.floor{position:absolute;left:-10%;right:-10%;bottom:-6vh;height:38vh;background:radial-gradient(50% 40% at 50% 30%,rgba(255,95,162,.35),transparent 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 64px);transform:perspective(500px) rotateX(62deg);transform-origin:50% 0}
#menu .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:grid;gap:0;min-height:100dvh;
 grid-template-columns:1fr;grid-template-areas:"top" "hero" "panel"}
.mTop{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:3}
.mark{display:flex;align-items:center;gap:10px}
.mark svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,95,162,.7))}
.mark{min-width:0}.mark>div{min-width:0;white-space:nowrap}
.mark b{display:block;font-size:10px;letter-spacing:.28em;color:#cfc8f2;font-weight:700}.mark span{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;
background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.chipBtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 6px;border-radius:99px;border:1px solid rgba(255,255,255,.14);background:rgba(16,12,32,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:700;font-size:13px;color:#fff}
.chipBtn.lang{padding:0 12px;letter-spacing:.08em}
.chipBtn{max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:none}
.mTop .row{flex-wrap:nowrap!important}
@media (max-width:420px){.mark svg{width:26px;height:26px}.mark b{font-size:8px;letter-spacing:.22em}.mark span{font-size:11px}.chipBtn{height:34px;font-size:12px;max-width:118px}.chipBtn.lang{padding:0 10px}.mTop .row{gap:6px!important}.panel{margin-top:6px!important}}
.chipBtn i{width:28px;height:28px;border-radius:50%;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.25) inset}
.hero{grid-area:hero;position:relative;height:min(50dvh,520px);display:flex;justify-content:center;align-items:flex-end;margin-top:-8px}

.hero .halo{position:absolute;bottom:4%;left:50%;width:min(80vw,520px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,95,162,.45) 0%,rgba(201,167,255,.18) 40%,transparent 68%);filter:blur(8px);animation:halo 1.5s ease-in-out infinite}

 filter:drop-shadow(0 0 1px rgba(255,255,255,.7)) drop-shadow(-12px 0 26px rgba(255,95,162,.7)) drop-shadow(14px 0 30px rgba(201,167,255,.5)) drop-shadow(0 0 60px rgba(255,95,162,.35)) contrast(1.06) saturate(1.1)}

/* Song 2: near-square hero (aspect ≈ 1.09) — show the whole kit, never crop */
.hero{container-type:size}
.hero .gImg{max-width:min(96vw,640px);max-width:min(100cqw,640px);object-fit:contain;object-position:50% 100%}
/* framed pose: a photo that does not show the full body + kit is shown whole inside a square, rose-glow frame.
   The square is capped by BOTH the hero's width and height (container units) so it never spills into the text panel in landscape. */
.hero .gImg.framed{height:auto;width:min(80vw,46dvh);width:min(92cqw,92cqh,560px);max-width:none;max-height:92%;aspect-ratio:1/1;object-fit:contain;object-position:50% 100%;bottom:2%;border-radius:26px;padding:10px 10px 0;
 border:2px solid var(--pink);background:radial-gradient(80% 70% at 50% 85%,rgba(255,95,162,.30),rgba(201,167,255,.10) 55%,rgba(10,6,22,.85) 100%);
 box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 0 18px rgba(255,95,162,.85),0 0 46px rgba(255,95,162,.55),0 0 90px rgba(201,167,255,.30);
 filter:contrast(1.04) saturate(1.06)}
.hero.pulse .gImg.framed.on{filter:contrast(1.06) saturate(1.12) brightness(1.05);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 0 26px rgba(255,95,162,1),0 0 70px rgba(255,95,162,.7),0 0 120px rgba(201,167,255,.4)}
.hero.pulse .gImg.on{filter:drop-shadow(0 0 2px #fff) drop-shadow(-14px 0 34px rgba(255,95,162,1)) drop-shadow(16px 0 36px rgba(201,167,255,.75)) drop-shadow(0 0 90px rgba(255,95,162,.6)) contrast(1.08) saturate(1.2) brightness(1.06)}
.hero .ring{position:absolute;left:50%;bottom:30%;width:40px;height:40px;margin-left:-20px;border-radius:50%;border:2px solid rgba(255,160,210,.9);z-index:1;opacity:0;pointer-events:none;box-shadow:0 0 30px rgba(255,95,162,.9),inset 0 0 20px rgba(255,95,162,.6)}

@keyframes ring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(16)}}
#menuFx{position:absolute;left:-20%;top:-10%;width:140%;height:120%;z-index:3;pointer-events:none}

.flare.f1{left:2%}.flare.f2{left:44%;animation-delay:-1.3s;opacity:.7}.flare.f3{right:2%;animation-delay:-2.6s;background:radial-gradient(circle,rgba(255,255,255,.9) 0,rgba(201,167,255,.45) 12%,transparent 55%)}
@keyframes flare{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
.playBtn{animation:playGlow 1.5s ease-in-out infinite}

 background:linear-gradient(180deg,#ff86bb 0%,#ff4f8b 45%,#e0245e 55%,#ff3b5c 100%);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 -6px 18px rgba(120,0,40,.45) inset,0 18px 50px rgba(255,59,92,.55),0 0 0 1px rgba(255,255,255,.12);text-shadow:0 2px 10px rgba(120,0,40,.6)}
.playBtn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine2 3.2s ease-in-out infinite}

      '<p>Rhythm Index = 100·(0.4·R + 0.3·(1 − min(SD,120)/120) + 0.3·(1 − min(|mean|,80)/80)).<br>Coordination Index = 100·(0.4·acc + 0.3·(1 − min(chord Δ,100)/100) + 0.3·min(limb,1)).</p><p>' +

/* ------------------------------ Norms ------------------------------ */
const NORMS = {
  version: '0.1',
  metrics: {
    srt_median_ms: { direction: 'lower_is_better', literature: [{ source: 'Der & Deary (2006)', doi: 'https://doi.org/10.1037/0882-7974.21.1.62', table: 'TODO(verify): age × sex means and SDs from the paper', sample: 'UK Health and Lifestyle Survey, N = 7,130, ages 18–90+',
      bands: { '18-29': { M: { mean: null, sd: null }, F: { mean: null, sd: null } } /* … fill from paper */ }, verified: false, caveat: 'Lab apparatus; web/touch RT is slower by device latency.' }] },
    crt4_median_ms: { direction: 'lower_is_better', literature: [{ source: 'Der & Deary (2006), 4-choice', doi: 'https://doi.org/10.1037/0882-7974.21.1.62', table: 'TODO(verify)', sample: 'UK HALS', bands: {}, verified: false, caveat: 'Lab apparatus.' }] },
    beatsync_sd_ms: { direction: 'lower_is_better', literature: [{ source: 'Dalla Bella et al. (2024), mobile BAASTA adult norms', doi: 'https://doi.org/10.3758/s13428-024-02363-x', table: 'TODO(verify)', sample: 'Adults (see paper)', bands: {}, verified: false, caveat: 'Different device and protocol.' }] },
    rhythm_index: { direction: 'higher_is_better', literature: [] },
    coordination_index: { direction: 'higher_is_better', literature: [] }
  },
  titles: { srt_median_ms: ['Simple reaction time', '简单反应时间'], crt4_median_ms: ['4-choice reaction time', '四选一反应时间'], beatsync_sd_ms: ['Beat Sync variability', '节拍同步变异'], rhythm_index: ['Rhythm Index', '节奏指数'], coordination_index: ['Coordination Index', '协调指数'] },
  remoteName: { srt_median_ms: 'srt', crt4_median_ms: 'crt', beatsync_sd_ms: 'beatsync', rhythm_index: 'rhythm', coordination_index: 'coordination' }
};
const Norms = {
  metricVal(rec, m) {
    const r = rec.reflex || {}, b = rec.beatsync || {};
    switch (m) { case 'srt_median_ms': return r.srt ? r.srt.median : null; case 'crt4_median_ms': return r.crt ? r.crt.median : null; case 'beatsync_sd_ms': return b.ioi600 ? b.ioi600.sd : null;
      case 'rhythm_index': return rec.rhythmIndex; case 'coordination_index': return rec.coordinationIndex; } return null;
  },
  collect(m) { const lower = NORMS.metrics[m].direction === 'lower_is_better', out = [];
    Profile.list().forEach(q => { let best = null; (q.history || []).forEach(rec => { const v = this.metricVal(rec, m); if (Number.isFinite(v) && v > 0) best = best === null ? v : (lower ? Math.min(best, v) : Math.max(best, v)); }); if (best !== null) out.push({ v: best, ab: q.ageBand, g: q.gender }); });
    return out; },
  cohort(m, x, p) {
    const lower = NORMS.metrics[m].direction === 'lower_is_better', all = this.collect(m), bothG = p.gender === 'M' || p.gender === 'F';
    let cell = bothG ? all.filter(o => o.ab === p.ageBand && o.g === p.gender) : [], label = 'age ' + p.ageBand + ', ' + (p.gender === 'M' ? 'male' : 'female');
    if (cell.length < 30) { cell = all.filter(o => o.ab === p.ageBand); label = 'age ' + p.ageBand; }
    if (cell.length >= 30) { let c = 0; cell.forEach(o => { if (lower ? o.v > x : o.v < x) c++; else if (o.v === x) c += .5; }); return { pct: c / cell.length * 100, n: cell.length, label, src: 'this device' }; }
    // remote cache (deciles)
    const cache = Storage.get(SK('normsCache'), {})[this.remoteKey(m)];
    if (cache && cache.cells) { const find = (ab, g) => cache.cells.find(c => c.ageBand === ab && c.gender === g && c.n >= 30);
      const c = (bothG && find(p.ageBand, p.gender)) || find(p.ageBand, 'ALL');
      if (c) { const d = c.deciles; let cdf; if (x <= d[0]) cdf = 5; else if (x >= d[8]) cdf = 95; else { let i = 0; while (i < 7 && x > d[i + 1]) i++; cdf = 10 * (i + 1) + 10 * (x - d[i]) / ((d[i + 1] - d[i]) || 1); }
        return { pct: lower ? 100 - cdf : cdf, n: c.n, label: 'age ' + c.ageBand + (c.gender === 'ALL' ? '' : ', ' + (c.gender === 'M' ? 'male' : 'female')), src: 'shared leaderboard' }; } }
    return { pct: null, n: cell.length, label };
  },
  remoteKey(m) { return NORMS.remoteName[m]; },
  async refresh() { if (!ENDPOINT()) return; const cache = Storage.get(SK('normsCache'), {}); if (cache._ts && Date.now() - cache._ts < 864e5) return;
    try { for (const m of Object.keys(NORMS.metrics)) { const j = await LeaderboardClient.get({ action: 'norms', metric: NORMS.remoteName[m] }); if (j && j.ok) cache[NORMS.remoteName[m]] = j; } cache._ts = Date.now(); Storage.set(SK('normsCache'), cache); } catch (e) {} },
  lit(m, x, p) {
    const lower = NORMS.metrics[m].direction === 'lower_is_better'; const adj = (m === 'srt_median_ms' || m === 'crt4_median_ms') ? x - (Settings.deviceLatencyMs || 0) : x;
    for (const L of NORMS.metrics[m].literature) { const b = L.bands[p.ageBand], c = b && b[p.gender] ? b[p.gender] : null;
      if (L.verified && c && c.mean != null && c.sd) { let z = (adj - c.mean) / c.sd; if (lower) z = -z; return { z, pct: Metrics.phi(z) * 100, src: L.source }; } }
    return null;
  },

  }
};

  run(ioi) {

    TestUI.set('<h3>' + ioi + ' ms</h3><div class="big num" id="bsN">0 / 40</div><div class="sm dim">' + T('Listen to 4 clicks, then tap along.', '先听 4 声，然后跟着点击。') + '</div>');

  },
  stop() { clearTimeout(this.tm); },
  analyse(taps, clicks, ioi) { const es = [], used = new Set(); taps.forEach(t => { let bi = -1, bd = 1e9; clicks.forEach((c, i) => { if (i < 4 || used.has(i)) return; const d = t - c; if (Math.abs(d) < Math.abs(bd)) { bd = d; bi = i; } }); if (bi >= 0 && Math.abs(bd) <= ioi / 2) { used.add(bi); es.push(bd); } });

  finish() {

      const rec = { sessionId: uuid(), playerId: p.playerId, nickname: p.nickname, age: p.age, ageBand: p.ageBand, gender: p.gender, hand: p.hand, musicExp: p.musicExp, ts: new Date().toISOString(), mode: 'beatsync', songId: Config.SONG_ID, difficulty: 'beatsync',
        beatsync: { ioi600: { mean: r6.mean, sd: r6.sd, R: r6.R, n: r6.n }, ioi450: { mean: r4.mean, sd: r4.sd, R: r4.R, n: r4.n } }, deviceOffsetMs: Settings.offsetMs, userAgent: navigator.userAgent.slice(0, 160), appVersion: Config.APP_VERSION };

      if (ENDPOINT() && p.consent.remote) Leaderboard.send({ action: 'submit', record: rec, entry: Leaderboard.entry(p, { sessionId: rec.sessionId, difficulty: 'beatsync' }), appVersion: Config.APP_VERSION }, null);
      if (r6.n >= 30) extra = Norms.html('beatsync_sd_ms', r6.sd); }
    TestUI.set('<h3>🎼 ' + T('Beat Sync results', '节拍同步结果') + '</h3><b>600 ms</b>' + this.card(r6) + '<b>450 ms</b>' + this.card(r4) + extra + '<p class="sm dim">' + T('Asynchrony is not corrected for device latency. Indicative only, not clinical.', '偏差未针对设备延迟校正。仅供参考，非临床。') + '</p><button class="btn" onclick="BeatSync.open()">↺ ' + T('Again', '再测') + '</button>');

    // song branding comes from Config only (so a new song = edit Config + beatmap + assets)
    const S = Config.song; document.title = 'intelliCARE Music Play-a-Long · ' + S.zh + ' ' + S.en;
    $('#hdrSong').textContent = S.zh + ' · ' + S.artist; $('#info .zh').textContent = S.zh; $('#info .en').textContent = S.en; const by = $$('#info .by'); if (by[1]) by[1].textContent = S.artist;
    const av = $('#hdr .gAv'); if (av) av.style.backgroundImage = 'url(' + (Config.AVATAR_IMG || Config.HERO_IMG) + ')';
    document.body.classList.toggle('kbd', !!Settings.keyLabels);
    const v = $('#vid'); this.videoMode = await VideoLoader.init(v); v.volume = Settings.videoVol; Input.build(); SongClock.init(v);
    DrumSynth.loadSamples();
    v.addEventListener('loadedmetadata', () => { Beatmap.refreshDuration(v.duration); Renderer.setMap(); if (!UI.sheetOpen() && Game.state === 'MENU') UI.renderMenu(); });
    v.addEventListener('ended', () => Game.onEnded()); v.addEventListener('error', () => UI.toast(T('Video failed to load. Check your connection.', '视频加载失败，请检查网络。')));
    await Beatmap.load(); Renderer.setMap(); this.layout(); Renderer.init();
    let rt; const rl = () => { clearTimeout(rt); rt = setTimeout(() => this.layout(), 100); }; addEventListener('resize', rl); try { matchMedia('(orientation: portrait)').addEventListener('change', rl); } catch (e) {}
    Input.bindKeys(); Input.enableMidi();
    $('#btnPause').addEventListener('click', () => Game.togglePause());
    $('#btnFs').addEventListener('click', () => { document.fullscreenElement ? document.exitFullscreen() : (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()); });
    $('#heartBtn').addEventListener('pointerdown', e => { e.preventDefault(); Game.activateHeart(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { if (Game.state === 'PLAYING') Game.pause(); } else Leaderboard.flush(); });
    addEventListener('online', () => Leaderboard.flush());
    document.addEventListener('contextmenu', e => e.preventDefault());
    applyI18n(); UI.showMenu(); Leaderboard.flush(true); Leaderboard.startAutoSync(); Norms.refresh();
    if (qs.get('test') === '1') Tests.run();
    if (qs.has('editor')) Editor.open();
  }
};
App.boot().catch(e => { console.error(e); document.body.insertAdjacentHTML('beforeend', '<pre style="position:fixed;inset:0;z-index:999;background:#300;color:#fff;padding:12px;white-space:pre-wrap">Startup error: ' + esc(e && e.stack || e) + '</pre>'); });
</script>
</body>
</html>
