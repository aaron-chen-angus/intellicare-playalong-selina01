<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>intelliCARE · chart ↔ video sync check</title>
<style>body{font:13px/1.4 ui-monospace,Consolas,monospace;background:#0a0a14;color:#e8e8f4;margin:0;padding:16px}pre{white-space:pre}</style></head>
<body><h3>Chart ↔ video sync spot check (acceptance S10.3: mean |error| &lt; 30 ms)</h3><pre id="log"></pre>
<script>
'use strict';
/* sync_check.html?video=<url>&chart=<beatmap_final.json>
   Detects kick onsets directly in the VIDEO soundtrack (40–120 Hz flux, 1 ms refined) and, at 5 points across the song,
   compares each chart kick (fire chart, + offsetMs) in a 10 s window with the nearest video kick onset (±80 ms). */
const L = [], log = s => { L.push(s); document.getElementById('log').textContent = L.join('\n'); };
function fft(re, im) { const n = re.length; for (let i = 1, j = 0; i < n; i++) { let b = n >> 1; for (; j & b; b >>= 1) j ^= b; j ^= b; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len = 2; len <= n; len <<= 1) { const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a); for (let i = 0; i < n; i += len) { let cr = 1, ci = 0; for (let k = 0; k < len / 2; k++) { const ur = re[i + k], ui = im[i + k], vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
    re[i + k] = ur + vr; im[i + k] = ui + vi; re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi; const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t; } } } }
(async () => { try {
  const q = new URLSearchParams(location.search), buf = async u => (await fetch(u)).arrayBuffer();
  const bm = JSON.parse(new TextDecoder().decode(await buf(q.get('chart')))), off = (bm.offsetMs || 0) / 1000;
  const ab = await new OfflineAudioContext(1, 44100, 44100).decodeAudioData(await buf(q.get('video'))), sr = ab.sampleRate;
  const x = new Float32Array(ab.length); for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let i = 0; i < x.length; i++) x[i] += d[i] / ab.numberOfChannels; }
  // 2 ms hop low-band log flux
  const N = 2048, hop = Math.round(sr * .002), nF = Math.floor((x.length - N) / hop), win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = .5 - .5 * Math.cos(2 * Math.PI * i / N);
  const re = new Float64Array(N), im = new Float64Array(N), E = new Float32Array(nF), b0 = Math.round(40 * N / sr), b1 = Math.round(120 * N / sr);
  for (let f = 0; f < nF; f++) { const o = f * hop; for (let i = 0; i < N; i++) { re[i] = x[o + i] * win[i]; im[i] = 0; } fft(re, im); let s = 0; for (let k = b0; k <= b1; k++) s += re[k] * re[k] + im[k] * im[k]; E[f] = Math.log10(1 + 1e6 * s); }
  const F = new Float32Array(nF); for (let f = 2; f < nF; f++) F[f] = Math.max(0, E[f] - E[f - 2]);
  const fT = f => (f * hop + N / 2) / sr;
  // onset = local max of flux within ±30 ms; the attack instant ≈ the frame of max flux
  const onsetNear = t => { const c = Math.round((t * sr - N / 2) / hop), w = Math.round(.08 * sr / hop); let best = -1, bv = 0; for (let f = Math.max(2, c - w); f < Math.min(nF, c + w); f++) if (F[f] > bv) { bv = F[f]; best = f; } return best < 0 ? null : fT(best); };
  // calibrate the detector's constant bias on the stem-derived chart: median error over the whole song, reported separately
  const kicks = bm.charts.fire.filter(n => n.l === 'kick').map(n => n.t + off), dur = ab.duration;
  const spots = [.2, .35, .5, .65, .8].map(p => p * dur), rows = []; let all = [];
  log('video ' + dur.toFixed(2) + ' s, chart kicks ' + kicks.length + ', offsetMs ' + (off * 1000));
  for (const s of spots) { const ks = kicks.filter(t => t >= s && t < s + 10), errs = [];
    for (const t of ks) { const o = onsetNear(t); if (o != null) errs.push((o - t) * 1000); }
    errs.sort((a, b) => a - b); const md = errs.length ? errs[errs.length >> 1] : NaN, mae = errs.length ? errs.reduce((a, e) => a + Math.abs(e), 0) / errs.length : NaN;
    rows.push({ at: +s.toFixed(1), kicks: ks.length, matched: errs.length, medianMs: +md.toFixed(1), meanAbsMs: +mae.toFixed(1) }); all = all.concat(errs);
    log('spot ' + s.toFixed(1).padStart(6) + ' s: ' + String(errs.length).padStart(2) + '/' + ks.length + ' kicks matched, median err ' + md.toFixed(1).padStart(6) + ' ms, mean |err| ' + mae.toFixed(1) + ' ms'); }
  const mean = rows.reduce((a, r) => a + r.meanAbsMs, 0) / rows.length, medAll = all.sort((a, b) => a - b)[all.length >> 1];
  log('\nmean |error| over 5 spots: ' + mean.toFixed(1) + ' ms   (overall median signed error ' + medAll.toFixed(1) + ' ms; + = video hit later than the gem)');
  log(mean < 30 ? 'PASS (< 30 ms)' : 'FAIL (≥ 30 ms)');
  window.OUT = { rows, meanAbsMs: +mean.toFixed(1), medianSignedMs: +medAll.toFixed(1) }; document.title = 'DONE';
} catch (e) { log('ERROR ' + (e.stack || e)); document.title = 'ERROR'; } })();
</script></body></html>
