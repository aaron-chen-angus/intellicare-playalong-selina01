<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>intelliCARE · tempo / bar / alignment analysis</title>
<style>body{font:13px/1.4 ui-monospace,Consolas,monospace;background:#0a0a14;color:#e8e8f4;margin:0;padding:16px}pre{white-space:pre;overflow:auto}</style></head>
<body><h3>Tempo grid · 4/4 bar patterns · piecewise stem→video alignment</h3><pre id="log"></pre>
<script>
'use strict';
/* Usage (headless, via tools/run_chart.ps1):
   chart.html?drums=<url>&video=<url>&notes=<url of tools/_check/beatmap.json>
   Reads the NMF note list produced by analyze.html (un-shifting meta.alignOffsetS), then
   1) piecewise cross-correlation of onset envelopes stem↔video (20 s windows, 5 s hop, lag ±25 s)
   2) constant-tempo grid fit on kick+snare onsets (circular resultant, BPM 60–200, 0.002 BPM steps), local drift check
   3) 4/4 downbeat phase (kick on beats 1 & 3, snare on 2 & 4), 16-step pattern string per bar per lane
   Output: window.OUT (JSON) + log text. document.title = DONE | ERROR. */
const L = []; const log = s => { L.push(s); document.getElementById('log').textContent = L.join('\n'); };
const r3 = x => Math.round(x * 1000) / 1000;
async function decode(buf) { const ac = new OfflineAudioContext(1, 44100, 44100); return await ac.decodeAudioData(buf); }
function mono(ab) { const n = ab.length, m = new Float32Array(n), c = ab.numberOfChannels; for (let ch = 0; ch < c; ch++) { const d = ab.getChannelData(ch); for (let i = 0; i < n; i++) m[i] += d[i] / c; } return m; }
function fft(re, im) { const n = re.length; for (let i = 1, j = 0; i < n; i++) { let b = n >> 1; for (; j & b; b >>= 1) j ^= b; j ^= b; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len = 2; len <= n; len <<= 1) { const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a); for (let i = 0; i < n; i += len) { let cr = 1, ci = 0; for (let k = 0; k < len / 2; k++) { const ur = re[i + k], ui = im[i + k], vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
    re[i + k] = ur + vr; im[i + k] = ui + vi; re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi; const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t; } } } }
/* onset envelope at FPS frames/s: log-compressed spectral flux in kick (40–120 Hz) + snare-crack (1.5–5 kHz) bands */
const FPS = 100;
function onsetEnv(x, sr) {
  const N = 2048, hop = Math.round(sr / FPS), nF = Math.floor((x.length - N) / hop) + 1, win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = .5 - .5 * Math.cos(2 * Math.PI * i / N);
  const bands = [[40, 120, 1.0], [1500, 5000, .7]], bin = f => Math.round(f * N / sr), re = new Float64Array(N), im = new Float64Array(N);
  const E = bands.map(() => new Float32Array(nF));
  for (let f = 0; f < nF; f++) { const o = f * hop; for (let i = 0; i < N; i++) { re[i] = x[o + i] * win[i]; im[i] = 0; } fft(re, im);
    bands.forEach((b, k) => { let s = 0; for (let j = bin(b[0]); j <= bin(b[1]); j++) s += re[j] * re[j] + im[j] * im[j]; E[k][f] = s; }); }
  const env = new Float32Array(nF);
  bands.forEach((b, k) => { let mx = 0; for (const v of E[k]) mx = Math.max(mx, v); const Lg = E[k].map(v => Math.log10(1 + 1e4 * v / (mx || 1)));
    for (let i = 1; i < nF; i++) env[i] += b[2] * Math.max(0, Lg[i] - Lg[i - 1]); });
  return env;
}
function znorm(a, s, e) { let m = 0, n = e - s; for (let i = s; i < e; i++) m += a[i]; m /= n; let v = 0; for (let i = s; i < e; i++) v += (a[i] - m) ** 2; const sd = Math.sqrt(v / n) || 1; const o = new Float32Array(n); for (let i = 0; i < n; i++) o[i] = (a[s + i] - m) / sd; return o; }
/* normalised cross-correlation of stem window [s,s+W) against video at lags lo..hi (video frame = stem frame + lag) */
function windowLag(A, B, s, W, lo, hi) {
  const a = znorm(A, s, s + W); let best = -1e9, bl = 0; const r = [];
  for (let lag = lo; lag <= hi; lag++) { const b0 = s + lag; if (b0 < 0 || b0 + W > B.length) { r.push(NaN); continue; }
    let m = 0; for (let i = 0; i < W; i++) m += B[b0 + i]; m /= W; let v = 0; for (let i = 0; i < W; i++) v += (B[b0 + i] - m) ** 2; const sd = Math.sqrt(v / W) || 1;
    let c = 0; for (let i = 0; i < W; i++) c += a[i] * (B[b0 + i] - m) / sd; c /= W; r.push(c); if (c > best) { best = c; bl = lag; } }
  const k = bl - lo, y0 = r[k - 1], y1 = r[k], y2 = r[k + 1]; let frac = 0; if (Number.isFinite(y0) && Number.isFinite(y2)) { const d = y0 - 2 * y1 + y2; if (d < 0) frac = .5 * (y0 - y2) / d; }
  const sorted = r.filter(Number.isFinite).sort((p, q) => q - p); const second = sorted.find((v, i) => i > 0 && Math.abs(r.indexOf(v) - k) > 30) || 0;
  return { lagS: (bl + frac) / FPS, corr: best, ratio: best / (second || 1e-9) };
}
/* circular-resultant tempo fit: maximise |Σ w·exp(i2πt/P)| over P */
function fitTempo(ts, ws, bpmLo, bpmHi, step) {
  let best = { R: -1 };
  for (let bpm = bpmLo; bpm <= bpmHi; bpm += step) { const P = 60 / bpm; let c = 0, s = 0, W = 0; for (let i = 0; i < ts.length; i++) { const a = 2 * Math.PI * ts[i] / P; c += ws[i] * Math.cos(a); s += ws[i] * Math.sin(a); W += ws[i]; }
    const R = Math.hypot(c, s) / W; if (R > best.R) best = { R, bpm, P, phase: ((Math.atan2(s, c) / (2 * Math.PI)) * P + P) % P }; }
  return best;
}
(async () => {
  try {
    const q = new URLSearchParams(location.search), get = async u => (await fetch(u)).arrayBuffer();
    const bm = JSON.parse(new TextDecoder().decode(await get(q.get('notes'))));
    const shift = (bm.meta && bm.meta.alignOffsetS) || 0, notes = bm.charts.full.map(n => ({ t: r3(n.t - shift), l: n.l, v: n.v }));
    log('notes (stem time): ' + notes.length + '   un-shifted by ' + shift + ' s');
    const da = await decode(await get(q.get('drums'))), x = mono(da); log('stem  ' + da.duration.toFixed(3) + ' s');
    const A = onsetEnv(x, da.sampleRate); let B = null, vdur = 0;
    if (q.get('video')) { const va = await decode(await get(q.get('video'))); vdur = va.duration; B = onsetEnv(mono(va), va.sampleRate); log('video ' + vdur.toFixed(3) + ' s  (difference ' + (da.duration - vdur).toFixed(3) + ' s)'); }
    /* 1) piecewise alignment */
    const align = [];
    if (B) { const W = 20 * FPS, hop = 5 * FPS; log('\n== piecewise alignment (video_t = stem_t + lag) =='); log(' stem_s   lag_s    corr   peak/2nd');
      for (let s = 0; s + W <= A.length; s += hop) { const r = windowLag(A, B, s, W, -25 * FPS, 25 * FPS); align.push({ stemS: s / FPS, lagS: r3(r.lagS), corr: r3(r.corr), ratio: r3(r.ratio) });
        log(String((s / FPS).toFixed(0)).padStart(6) + '  ' + r.lagS.toFixed(3).padStart(7) + '  ' + r.corr.toFixed(3).padStart(6) + '  ' + r.ratio.toFixed(2).padStart(6)); } }
    /* 2) tempo */
    const KS = notes.filter(n => n.l === 'kick' || n.l === 'snare'), ts = KS.map(n => n.t), ws = KS.map(n => n.v);
    const coarse = fitTempo(ts, ws, 60, 200, .05), fine = fitTempo(ts, ws, coarse.bpm - .2, coarse.bpm + .2, .001);
    log('\n== tempo ==\nbeat-level fit: ' + fine.bpm.toFixed(3) + ' BPM (P = ' + (fine.P * 1000).toFixed(2) + ' ms), resultant R = ' + fine.R.toFixed(3) + ', phase ' + fine.phase.toFixed(3) + ' s');
    for (const m of [.5, 2 / 3, 2]) { const alt = fitTempo(ts, ws, fine.bpm * m - .1, fine.bpm * m + .1, .002); log('  alt ×' + m.toFixed(2) + ': ' + alt.bpm.toFixed(2) + ' BPM R=' + alt.R.toFixed(3)); }
    const P = fine.P; let ph = fine.phase;
    // local drift: residual of onsets vs grid in 30 s blocks
    log('local residual (ms, median of kick/snare offsets from nearest beat) per 30 s:');
    const res = []; for (let b = 0; b < da.duration; b += 30) { const d = KS.filter(n => n.t >= b && n.t < b + 30).map(n => { let e = ((n.t - ph) % P + P) % P; if (e > P / 2) e -= P; return e * 1000; }).sort((p, q) => p - q); const md = d.length ? d[d.length >> 1] : NaN; res.push(md); log('  ' + String(b).padStart(3) + '–' + String(b + 30).padStart(3) + ' s: n=' + String(d.length).padStart(3) + '  median ' + (Number.isFinite(md) ? md.toFixed(1) : '–')); }
    /* 3) first beat + 4/4 downbeat phase */
    const firstOn = notes.length ? notes[0].t : 0; let k0 = Math.floor((firstOn - ph) / P); const beat0 = ph + k0 * P;
    const nBeats = Math.ceil((da.duration - beat0) / P) + 1, beats = []; for (let k = 0; k < nBeats; k++) beats.push(r3(beat0 + k * P));
    const beatIdx = t => Math.round((t - beat0) / P), onBeat = t => Math.abs(t - (beat0 + beatIdx(t) * P)) < .06;
    const sc = [0, 0, 0, 0]; for (const n of notes) { if (!onBeat(n.t)) continue; const i = beatIdx(n.t); for (let p = 0; p < 4; p++) { const pos = ((i - p) % 4 + 4) % 4;
      if (n.l === 'kick') sc[p] += pos === 0 ? 2 : pos === 2 ? 1.2 : -.6; if (n.l === 'snare') sc[p] += (pos === 1 || pos === 3) ? 1.5 : -.8; if (n.l === 'cymbal' && pos === 0) sc[p] += 1; } }
    const dp = sc.indexOf(Math.max(...sc)); log('\n== 4/4 downbeat ==\nphase scores ' + sc.map(v => v.toFixed(0)).join(' / ') + ' → downbeat = beat index ' + dp + ' mod 4');
    const bar0 = beat0 + dp * P - (dp > 0 ? 4 * P : 0), BAR = 4 * P, nBars = Math.ceil((da.duration - bar0) / BAR);
    /* 16-step patterns */
    const lanes = ['kick', 'snare', 'hihat', 'tom', 'cymbal'], ch = { kick: 'K', snare: 'S', hihat: 'H', tom: 'T', cymbal: 'C' }, bars = [];
    for (let b = 0; b < nBars; b++) { const t0 = bar0 + b * BAR, row = {}; let off = []; for (const l of lanes) row[l] = Array(16).fill('.');
      for (const n of notes) { if (n.t < t0 - P / 8 || n.t >= t0 + BAR - P / 8) continue; const st = Math.round((n.t - t0) / (P / 4)); if (st < 0 || st > 15) continue; row[n.l][st] = ch[n.l]; off.push(Math.abs(n.t - (t0 + st * P / 4)) * 1000); }
      bars.push({ bar: b + 1, t: r3(t0), p: Object.fromEntries(lanes.map(l => [l, row[l].join('')])), devMs: off.length ? Math.round(off.reduce((a, c) => a + c, 0) / off.length) : null }); }
    log('\n== bars (16 steps = 16th notes; | marks each beat) ==');
    const fmtP = s => s.slice(0, 4) + '|' + s.slice(4, 8) + '|' + s.slice(8, 12) + '|' + s.slice(12);
    for (const b of bars) log(String(b.bar).padStart(3) + ' ' + b.t.toFixed(2).padStart(7) + 's  K ' + fmtP(b.p.kick) + '  S ' + fmtP(b.p.snare) + '  H ' + fmtP(b.p.hihat) + '  T ' + fmtP(b.p.tom) + '  C ' + fmtP(b.p.cymbal) + '  ±' + b.devMs);
    window.OUT = { stemDur: da.duration, videoDur: vdur, align, bpm: fine.bpm, P, R: fine.R, beat0, downbeatPhase: dp, bar0, nBars, beats, bars, driftMs: res };
    document.title = 'DONE';
  } catch (e) { log('ERROR ' + (e.stack || e)); document.title = 'ERROR'; }
})();
</script></body></html>
