<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font:14px/1.45 system-ui,"Segoe UI",sans-serif;background:#0a0a14;color:#e8e8f4;margin:0;padding:20px}
h1{font-size:20px;margin:0 0 6px}.box{border:1px dashed #556;border-radius:12px;padding:16px;margin:10px 0}
button{background:#ff3b5c;border:0;color:#fff;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer}
pre{white-space:pre-wrap;background:#000;padding:10px;border-radius:8px;max-height:300px;overflow:auto;font-size:12px}

</style></head><body>
<h1>Drum-stem analyser → beatmap.json</h1>
<p>Choose the <b>isolated drum track</b> (WAV/MP3) of the song. Optionally choose the <b>performance video/audio</b> too: the analyser then cross-correlates the two and corrects any time offset so the chart lines up with the video. Everything runs locally in your browser.</p>
<div class="box"><label>Drum track: <input type="file" id="fDrums" accept="audio/*,video/*"></label>
<label>Drum samples KICK / SNARE / HI-HAT / TOM / CYMBAL (select all 5; used as NMF templates): <input type="file" id="fSamples" accept="audio/*" multiple></label>
<label>Video or full mix (optional, for alignment): <input type="file" id="fVideo" accept="audio/*,video/*"></label>
<button id="go">Analyse</button> <button id="dl" disabled>Download beatmap.json</button></div>
<pre id="log"></pre><div id="imgs"></div><pre id="out"></pre>
